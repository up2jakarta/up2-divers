spring:
  main:
    web-application-type: NONE
    banner-mode: OFF
  batch:
    jdbc.initialize-schema: never
    job.enabled: false
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    platform: h2
    hikari.schema: test
    driver-class-name: org.h2.Driver
    hikari:
      #schema: ${eir.jdbc.schema}
      connection-test-query: SELECT 1
      auto-commit: false
      test-on-borrow: false
      max-lifetime: 3600000
      idle-timeout: 600000
      minimum-idle: 0
      maximum-pool-size: 20
      data-source-properties:
      socketTimeout: 30
  jpa:
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: tn.aabbessi.eir.jpa.PgSQLDialect
        #default_schema: ${eir.jdbc.schema}
        hbm2ddl.auto: validate
        show_sql: false # see logback.xml
        format_sql: true
        use_sql_comments: true
        jdbc.batch_size: 50